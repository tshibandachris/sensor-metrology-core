name: Verify Sensor Metrology

on:
  push:
    branches:
      - main
      - feature/hardened-io-gate
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: metrology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python 3.12 — Integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run verbose unit tests
        run: |
          python -m unittest discover -s tests -p "test_sensor_auditor.py" -v
