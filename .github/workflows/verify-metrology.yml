name: Verify Sensor Metrology

on:
  push:
    branches:
      - main
      - feature/hardened-io-gate
      - feature/clean-hardened-io
      - feature/sqlite-transactional-ledger
      - feature/remote-trust-checkpoint
      - feature/tls-transport-layer
      - feature/witness-key-ops-hardening
  pull_request:
    branches:
      - main
      - feature/tls-transport-layer

permissions:
  contents: read

concurrency:
  group: metrology-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python 3.12 — Integrity tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install strict typing tools
        run: |
          python -m pip install mypy types-setuptools

      - name: Mandatory ledger and integrity-test strict typing gate
        run: |
          mypy --strict chronological_ledger.py transactional_ledger.py remote_trust_bridge.py remote_trust_outbox.py sensor_trust_server.py tests/test_server_communication.py tests/test_server_handshake.py tests/test_ledger_integrity.py tests/test_transactional_ledger.py tests/remote_trust_stub.py tests/test_remote_trust.py tests/test_remote_trust_outbox.py tests/test_multiprocess_recovery.py

      - name: Mandatory rotation utility strict typing gate
        run: |
          mypy --strict rotate_witness_keys.py tests/test_key_rotation.py

      - name: Mandatory witness key loader strict typing gate
        run: |
          mypy --strict witness_key_loader.py

      - name: Mandatory auditor strict typing gate
        run: |
          mypy --strict sensor_integrity_auditor.py

      - name: Mandatory unittest discovery gate
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
